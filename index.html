<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Zoya - Coming Soon</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; } /* आसमान का रंग */
        #info {
            position: absolute; top: 20px; width: 100%;
            text-align: center; color: white; font-family: Arial, sans-serif;
            font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000;
        }
    </style>
    <!-- Three.js और Camera Controls के CDN लिंक्स -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <!-- Coming Soon टेक्स्ट -->
    <div id="info">MINI ZOYA GAMING LAB<br>🔥 Coming Soon 🔥</div>

    <script>
        // 1. 3D सीन और कैमरा सेटअप
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10); // कैमरे की ऊँचाई और दूरी

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 360° घुमाने के लिए कंट्रोल्स
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // घुमाने में असली गेम जैसी स्मूथनेस

        // 3. रोशनी (Lighting - असली 3D इफ़ेक्ट के लिए)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 4. ज़मीन (अस्थायी ग्रिड, जिसे बाद में असली घास से बदलेंगे)
        const gridHelper = new THREE.GridHelper(50, 50, 0x000000, 0xffffff);
        scene.add(gridHelper);

        // 5. एनिमेशन लूप (ताकि सीन लगातार रेंडर होता रहे)
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // स्क्रीन साइज़ बदलने पर कैमरा एडजस्ट करना
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
