<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Winner - Giveaway v0.1</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 20px; 
            background-color: #0b0b0b; 
            color: #ffffff; 
            font-family: 'Arial', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            background: #161616; 
            padding: 30px 20px; 
            border-radius: 20px; 
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.2); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            border: 2px solid #ffaa00; 
        }
        h1 { 
            font-family: 'Impact', sans-serif; 
            color: #ffaa00; 
            letter-spacing: 2px; 
            margin: 0 0 5px 0; 
            font-size: 32px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .version { 
            color: #00ff00; 
            font-size: 13px; 
            margin-bottom: 20px; 
            display: block; 
            font-weight: bold; 
            letter-spacing: 1px;
        }
        .info-text { 
            font-size: 15px; 
            color: #cccccc; 
            margin-bottom: 25px; 
            line-height: 1.6; 
        }
        .input-box {
            width: 100%;
            padding: 14px 15px;
            margin: 12px 0;
            border: 1px solid #333;
            border-radius: 10px;
            background: #222222;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-box:focus { 
            border-color: #ffaa00; 
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
        }
        .submit-btn { 
            width: 100%; 
            padding: 15px; 
            margin-top: 15px; 
            border: none; 
            border-radius: 10px; 
            background: linear-gradient(45deg, #ff4500, #ffaa00); 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4); 
            transition: 0.2s;
        }
        .submit-btn:active { transform: scale(0.97); }
        
        .insta-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(45deg, #405de6, #833ab4, #fd1d1d);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(131, 58, 180, 0.4);
        }
        
        #message { display: none; margin-top: 20px; font-weight: bold; font-size: 15px; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 WORLD WINNER</h1>
        <span class="version">GIVEAWAY PORTAL v0.1</span>
        <p class="info-text">हर हफ़्ते जीतें असली Free Fire डायमंड्स! 💎<br><span style="color: #ffaa00; font-size: 13px;">⚠️ ध्यान दें: पहले इंस्टाग्राम पर फॉलो करना अनिवार्य है।</span></p>
        
        <input type="number" id="uid" class="input-box" placeholder="अपना Free Fire UID डालें" required>
        <input type="text" id="ign" class="input-box" placeholder="गेम का नाम (In-Game Name)" required>
        
        <button class="submit-btn" onclick="submitForm()">🎁 डायमंड्स के लिए अप्लाई करें</button>
        
        <!-- यहाँ अपना असली Instagram लिंक डाल सकते हैं -->
        <a href="https://instagram.com" target="_blank" class="insta-btn">📸 Instagram पर फॉलो करें</a>

        <div id="message"></div>
    </div>

    <script>
        function submitForm() {
            let uid = document.getElementById("uid").value.trim();
            let ign = document.getElementById("ign").value.trim();
            let msg = document.getElementById("message");
            
            if(uid === "" || ign === "") {
                msg.style.background = "rgba(255, 69, 0, 0.2)";
                msg.style.color = "#ff4500";
                msg.innerHTML = "⚠️ कृपया अपनी सही UID और गेम का नाम भरें!";
                msg.style.display = "block";
            } else {
                msg.style.background = "rgba(0, 255, 0, 0.1)";
                msg.style.color = "#00ff00";
                msg.innerHTML = "✅ बधाई हो! आपकी एंट्री सक्सेसफुली सेव हो गई है।";
                msg.style.display = "block";
                
                // फॉर्म खाली करना
                document.getElementById("uid").value = "";
                document.getElementById("ign").value = "";
            }
        }
    </script>
</body>
</html>
