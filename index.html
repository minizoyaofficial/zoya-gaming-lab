<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Winner - Map v0.4</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        /* गेम का UI और नीला आसमान */
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-family: 'Impact', sans-serif; font-size: 28px; text-shadow: 2px 2px 5px #000; pointer-events: none; z-index: 10; letter-spacing: 1px;}
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff00; font-size: 28px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 1px 1px 2px #000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">🏆 WORLD WINNER 🏆<br><span style="font-size:16px; color:#FFD700;">Map v0.4 - Trees & Weapon</span></div>
    
    <!-- गेमिंग निशाना -->
    <div id="crosshair">✛</div>

    <script>
        // 1. सीन और बादलों वाला कोहरा
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB'); 
        scene.fog = new THREE.FogExp2('#87CEEB', 0.003); 

        // 2. कैमरा (गेमर की आँखें)
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 25); 
        scene.add(camera); // कैमरे को सीन में जोड़ना ज़रूरी है ताकि गन दिखे

        // 3. हाथ में बंदूक (FPS Weapon)
        const gunGeo = new THREE.BoxGeometry(0.8, 0.8, 3.5);
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 }); // गन का डार्क रंग
        const gun = new THREE.Mesh(gunGeo, gunMat);
        // गन को कैमरे के सामने दाईं तरफ सेट करना
        gun.position.set(1.8, -1.5, -4); 
        camera.add(gun); // गन कैमरे के साथ घूमेगी

        // 4. रेंडरर और परछाई
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; 
        controls.target.set(0, 5, 0); 

        // 5. सूरज और लाइटिंग
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(100, 200, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024; 
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.left = -150;
        sunLight.shadow.camera.right = 150;
        sunLight.shadow.camera.top = 150;
        sunLight.shadow.camera.bottom = -150;
        scene.add(sunLight);

        // 6. असली घास वाली ज़मीन
        const textureLoader = new THREE.TextureLoader();
        const grassTexture = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        grassTexture.wrapS = THREE.RepeatWrapping;
        grassTexture.wrapT = THREE.RepeatWrapping;
        grassTexture.repeat.set(60, 60); 

        const groundGeo = new THREE.PlaneGeometry(1000, 1000, 80, 80);
        const vertices = groundGeo.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i];
            const y = vertices[i + 1];
            vertices[i + 2] = Math.sin(x / 40) * 8 + Math.cos(y / 40) * 8; 
        }
        groundGeo.computeVertexNormals();

        const groundMat = new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 0.9 }); 
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 7. छुपने के बक्से (Crates)
        const crateTexture = textureLoader.load('https://threejs.org/examples/textures/crate.gif');
        const boxGeo = new THREE.BoxGeometry(6, 6, 6);
        const boxMat = new THREE.MeshStandardMaterial({ map: crateTexture, roughness: 0.8 });
        
        for(let i = 0; i < 30; i++) {
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.x = (Math.random() - 0.5) * 400;
            box.position.z = (Math.random() - 0.5) * 400;
            box.position.y = Math.sin(box.position.x / 40) * 8 + Math.cos(box.position.z / 40) * 8 + 3; 
            box.rotation.y = Math.random() * Math.PI; 
            box.castShadow = true;
            box.receiveShadow = true;
            scene.add(box);
        }

        // 8. बरमूडा के पेड़ (Trees) बनाना
        const trunkGeo = new THREE.CylinderGeometry(0.6, 1, 6, 8); // पेड़ का तना
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 1 });
        const leavesGeo = new THREE.ConeGeometry(4, 10, 8); // पेड़ की पत्तियां
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x228b22, roughness: 0.8 });

        for(let i = 0; i < 60; i++) {
            const tree = new THREE.Group();
            
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 3;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 9;
            leaves.castShadow = true;
            
            tree.add(trunk);
            tree.add(leaves);
            
            tree.position.x = (Math.random() - 0.5) * 400;
            tree.position.z = (Math.random() - 0.5) * 400;
            tree.position.y = Math.sin(tree.position.x / 40) * 8 + Math.cos(tree.position.z / 40) * 8;
            
            scene.add(tree);
        }

        // 9. एनिमेशन लूप
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
