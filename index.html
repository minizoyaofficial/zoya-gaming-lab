<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Winner - Giveaway v0.0</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #ffffff; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px #ffaa00; width: 85%; max-width: 400px; text-align: center; border: 2px solid #ffaa00; }
        h1 { font-family: 'Impact', sans-serif; color: #ffaa00; letter-spacing: 2px; margin-bottom: 5px; font-size: 28px; }
        .version { color: #00ff00; font-size: 14px; margin-bottom: 20px; display: block; font-weight: bold; }
        .info-text { font-size: 14px; color: #cccccc; margin-bottom: 20px; line-height: 1.5; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #444; border-radius: 5px; background: #2a2a2a; color: white; font-size: 16px; outline: none; }
        input:focus { border-color: #ffaa00; }
        button { width: 95%; padding: 15px; margin-top: 15px; border: none; border-radius: 5px; background: linear-gradient(45deg, #ff4500, #ffaa00); color: white; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4); }
        button:active { transform: scale(0.98); }
        #message { display: none; margin-top: 15px; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 WORLD WINNER</h1>
        <span class="version">Giveaway Portal v0.0</span>
        <p class="info-text">हर हफ़्ते जीतें असली डायमंड्स! 💎<br>शर्त: हमारे Instagram को फ़ॉलो करना ज़रूरी है।</p>
        
        <input type="text" id="uid" placeholder="अपना Free Fire UID डालें" required>
        <input type="text" id="ign" placeholder="गेम का नाम (In-Game Name)" required>
        
        <button onclick="submitForm()">🎁 डायमंड्स के लिए अप्लाई करें</button>
        <p id="message"></p>
    </div>

    <script>
        function submitForm() {
            let uid = document.getElementById("uid").value;
            let ign = document.getElementById("ign").value;
            let msg = document.getElementById("message");
            
            if(uid === "" || ign === "") {
                msg.style.color = "#ff4500"; // लाल रंग
                msg.innerHTML = "⚠️ कृपया अपना UID और नाम भरें!";
                msg.style.display = "block";
            } else {
                msg.style.color = "#00ff00"; // हरा रंग
                msg.innerHTML = "✅ आपकी एंट्री सेव हो गई है! रिज़ल्ट का इंतज़ार करें।";
                msg.style.display = "block";
            }
        }
    </script>
</body>
</html>
