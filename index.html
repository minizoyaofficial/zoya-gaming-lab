<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Winner - Map v0.6</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #5ab1e6; }
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-family: 'Impact', sans-serif; font-size: 28px; text-shadow: 2px 2px 5px #000; pointer-events: none; z-index: 10; letter-spacing: 1px;}
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 255, 255, 0.9); font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 1px 1px 3px #000; }
    </style>
    <!-- 3D लाइब्रेरी और लोडर्स -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="ui">🏆 WORLD WINNER 🏆<br><span style="font-size:16px; color:#00FF00;">Map v0.6 - 3D Training Ground Base</span></div>
    <div id="crosshair">✛</div>

    <script>
        // 1. सीन और खुला आसमान
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#5ab1e6'); // साफ नीला आसमान
        scene.fog = new THREE.FogExp2('#5ab1e6', 0.003); // आउटडोर कोहरा

        // 2. कैमरा (गेमर व्यू)
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 30); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; 
        controls.target.set(0, 5, 0);

        // 3. गेमिंग लाइटिंग (सूरज)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(150, 200, 100);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048; 
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -150;
        sunLight.shadow.camera.right = 150;
        sunLight.shadow.camera.top = 150;
        sunLight.shadow.camera.bottom = -150;
        scene.add(sunLight);

        const textureLoader = new THREE.TextureLoader();

        // 4. विशाल 3D मैदान (Grass)
        const grassTexture = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        grassTexture.wrapS = grassTexture.wrapT = THREE.RepeatWrapping;
        grassTexture.repeat.set(50, 50);

        const groundGeo = new THREE.PlaneGeometry(800, 800, 64, 64);
        const vertices = groundGeo.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            // ज़मीन को थोड़ा सा ऊबड़-खाबड़ बनाना
            vertices[i + 2] = Math.sin(vertices[i] / 50) * 4 + Math.cos(vertices[i + 1] / 50) * 4; 
        }
        groundGeo.computeVertexNormals();

        const groundMat = new THREE.MeshStandardMaterial({ map: grassTexture, roughness: 0.9 }); 
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 5. 3D मैप के स्ट्रक्चर (Training Ground Base)
        const concreteTexture = textureLoader.load('https://threejs.org/examples/textures/crate.gif'); // कंक्रीट/लकड़ी का टेक्सचर
        
        // बीच का बड़ा प्लेटफॉर्म
        const platformGeo = new THREE.BoxGeometry(40, 2, 40);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.7 });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.set(0, 1, 0);
        platform.receiveShadow = true;
        platform.castShadow = true;
        scene.add(platform);

        // चढ़ने के लिए रैम्प (Ramps)
        const rampGeo = new THREE.BoxGeometry(10, 2, 20);
        const ramp1 = new THREE.Mesh(rampGeo, platformMat);
        ramp1.position.set(0, 0, 28);
        ramp1.rotation.x = -Math.PI / 8; // रैम्प को तिरछा करना
        ramp1.receiveShadow = true; ramp1.castShadow = true;
        scene.add(ramp1);

        // छुपने के लिए दीवारें (Cover Walls)
        const wallGeo = new THREE.BoxGeometry(12, 6, 2);
        const wallMat = new THREE.MeshStandardMaterial({ map: concreteTexture });
        
        const wallPositions = [
            {x: -10, z: -10, r: 0},
            {x: 10, z: 10, r: 0},
            {x: -15, z: 10, r: Math.PI / 4},
            {x: 15, z: -10, r: -Math.PI / 4}
        ];

        wallPositions.forEach(pos => {
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(pos.x, 4, pos.z);
            wall.rotation.y = pos.r;
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
        });

        // 6. एनिमेशन लूप
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
