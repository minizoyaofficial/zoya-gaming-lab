<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Zoya AI | Gaming Companion</title>
<style>
  :root {
    --bg: #070b14;
    --panel: #111827;
    --gold: #fbbf24;
    --pink: #f43f5e;
    --blue: #38bdf8;
    --green: #10b981;
    --text: #f8fafc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 60%);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* SIMPLE TOP BAR */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(17, 24, 39, 0.9);
    border-bottom: 1px solid rgba(251, 191, 36, 0.3);
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .avatar-dot {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; border: 2px solid #fff;
  }
  .brand-text h1 { font-size: 16px; font-weight: 900; color: #fff; line-height: 1.1; }
  .online-tag { font-size: 11px; color: #34d399; font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #10b981; }

  .lang-switch { display: flex; gap: 4px; }
  .l-btn {
    background: #1f2937; color: #cbd5e1; border: 1px solid #374151;
    padding: 4px 9px; border-radius: 99px; font-size: 11px; font-weight: 800; cursor: pointer;
  }
  .l-btn.active { background: var(--gold); color: #000; border-color: #fff; }

  /* MAIN SINGLE SCREEN AREA */
  .chat-stage {
    flex: 1;
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
    padding: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }

  /* ZOYA MESSAGE CARD */
  .zoya-card {
    background: linear-gradient(145deg, #151f32, #0f172a);
    border: 2px solid var(--gold);
    border-radius: 20px;
    padding: 18px 16px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .zoya-badge {
    display: inline-block;
    background: rgba(251, 191, 36, 0.15);
    color: var(--gold);
    font-size: 11px;
    font-weight: 900;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 8px;
  }
  .zoya-msg { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.4; margin-bottom: 12px; }

  /* DYNAMIC OUTPUT BOX INSIDE MAIN CARD */
  .magic-output {
    background: #090d16;
    border: 1px dashed var(--blue);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    text-align: center;
  }

  /* 3 SIMPLE BIG MAGIC BUTTONS */
  .magic-grid {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .magic-btn {
    width: 100%;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.15);
    background: linear-gradient(90deg, #1e293b, #0f172a);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: 0.2s;
  }
  .magic-btn:active { transform: scale(0.98); }
  .magic-btn.gold {
    background: linear-gradient(90deg, var(--gold), #f59e0b);
    color: #000;
    border: none;
    font-weight: 900;
    box-shadow: 0 4px 15px rgba(251, 191, 36, 0.35);
  }

  /* CHAT INPUT BAR (BOTTOM LIKE CHATGPT) */
  .bottom-bar {
    background: #0f172a;
    border-top: 1px solid #1e293b;
    padding: 10px 12px;
  }
  .input-wrap {
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  .chat-input {
    flex: 1;
    background: #1e293b;
    border: 1px solid #3b82f6;
    color: #fff;
    padding: 12px 14px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 700;
    outline: none;
  }
  .send-btn {
    background: linear-gradient(90deg, var(--pink), var(--gold));
    color: #000;
    border: none;
    padding: 0 18px;
    border-radius: 99px;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
  }
  .copy-pill {
    margin-top: 8px;
    background: var(--green);
    color: #000;
    border: none;
    padding: 7px 16px;
    border-radius: 99px;
    font-weight: 900;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="brand">
    <div class="avatar-dot">👧</div>
    <div class="brand-text">
      <h1>Mini Zoya AI</h1>
      <div class="online-tag"><span class="dot"></span> <span id="statusTxt">Online • Gaming AI</span></div>
    </div>
  </div>
  <div class="lang-switch">
    <button class="l-btn active" onclick="switchLang('gu', this)">ગુજરાતી</button>
    <button class="l-btn" onclick="switchLang('hi', this)">हिंदी</button>
    <button class="l-btn" onclick="switchLang('en', this)">English</button>
  </div>
</div>

<!-- SINGLE SCREEN STAGE -->
<div class="chat-stage">
  <div class="zoya-card">
    <div class="zoya-badge" id="badgeTxt">✨ INDIA'S FIRST GAMING AI FRIEND</div>
    <div class="zoya-msg" id="greetingTxt">કેમ છો દોસ્ત! 🙏 હું Mini Zoya AI છું. નીચે ફક્ત 1 બટન દબાવો અથવા તમારું નામ લખો!</div>

    <!-- ONE CLEAN DISPLAY BOX -->
    <div class="magic-output" id="screenBox">
      <div style="font-size:32px;">🎁</div>
      <div style="font-size:15px; font-weight:900; color:var(--gold); margin-top:4px;" id="boxTitle">આજનું VIP ગેમિંગ સરપ્રાઈઝ તૈયાર છે!</div>
      <div style="font-size:12px; color:#94a3b8; margin-top:3px;" id="boxSub">નીચેથી કોઈપણ 1 બટન પર ટચ કરો 👇</div>
    </div>

    <!-- ONLY 3 CLEAR BUTTONS -->
    <div class="magic-grid">
      <button class="magic-btn gold" onclick="openSurprise()">
        <span id="btn1Txt">🎁 1. આજનું VIP સરપ્રાઈઝ ખોલો (Open Gift)</span>
        <span>➔</span>
      </button>
      <button class="magic-btn" onclick="givePhoneCode()">
        <span id="btn2Txt">🎯 2. મારા ફોનનું Auto-Headshot કોડ આપો</span>
        <span>➔</span>
      </button>
      <button class="magic-btn" onclick="makeMyCard()">
        <span id="btn3Txt">👑 3. મારા નામનું Golden VIP Card બનાવો</span>
        <span>➔</span>
      </button>
    </div>

    <a href="https://instagram.com/minizoyaofficial" target="_blank" style="display:inline-block; margin-top:12px; font-size:12px; color:var(--gold); font-weight:800; text-decoration:none;">📸 Follow @minizoyaofficial on Instagram ➔</a>
  </div>
</div>

<!-- BOTTOM CHATGPT-STYLE INPUT BAR -->
<div class="bottom-bar">
  <div class="input-wrap">
    <input type="text" class="chat-input" id="userInput" placeholder="તમારું નામ કે ફોન લખો (e.g. Raj / Vivo)..." onkeydown="if(event.key==='Enter') askZoya()">
    <button class="send-btn" onclick="askZoya()" id="sendTxt">Ask ✨</button>
  </div>
</div>

<script>
let lang = 'gu';

const texts = {
  gu: {
    statusTxt: "ઓનલાઇન • ગેમિંગ AI",
    greetingTxt: "કેમ છો દોસ્ત! 🙏 હું Mini Zoya AI છું. નીચે ફક્ત 1 બટન દબાવો અથવા તમારું નામ લખો!",
    boxTitle: "આજનું VIP ગેમિંગ સરપ્રાઈઝ તૈયાર છે!",
    boxSub: "નીચેથી કોઈપણ 1 બટન પર ટચ કરો 👇",
    btn1Txt: "🎁 1. આજનું VIP સરપ્રાઈઝ ખોલો (Open Gift)",
    btn2Txt: "🎯 2. મારા ફોનનું Auto-Headshot કોડ આપો",
    btn3Txt: "👑 3. મારા નામનું Golden VIP Card બનાવો",
    placeholder: "તમારું નામ કે ફોન લખો (e.g. Raj / Vivo)..."
  },
  hi: {
    statusTxt: "ऑनलाइन • गेमिंग AI",
    greetingTxt: "केम छो दोस्त! 🙏 मैं Mini Zoya AI हूँ। नीचे सिर्फ 1 बटन दबाएं या अपना नाम लिखें!",
    boxTitle: "आज का VIP गेमिंग सरप्राइज तैयार है!",
    boxSub: "नीचे से किसी भी 1 बटन को टच करें 👇",
    btn1Txt: "🎁 1. आज का VIP सरप्राइज खोलें (Open Gift)",
    btn2Txt: "🎯 2. मेरे फोन का Auto-Headshot कोड दें",
    btn3Txt: "👑 3. मेरे नाम का Golden VIP Card बनाएं",
    placeholder: "अपना नाम या फोन लिखें (जैसे: Raj / Vivo)..."
  },
  en: {
    statusTxt: "Online • Gaming AI",
    greetingTxt: "Hello Gamer! 🙏 I am Mini Zoya AI. Tap just 1 button below or type your name!",
    boxTitle: "Today's VIP Gaming Surprise is Ready!",
    boxSub: "Tap any 1 button below to unlock 👇",
    btn1Txt: "🎁 1. Open Today's VIP Mystery Gift",
    btn2Txt: "🎯 2. Give My Phone's Headshot & Zero-Recoil Code",
    btn3Txt: "👑 3. Generate My Golden VIP Gamer Card",
    placeholder: "Type your Name or Phone (e.g. Raj / Vivo)..."
  }
};

function switchLang(l, btn) {
  lang = l;
  document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = texts[l];
  document.getElementById('statusTxt').innerText = t.statusTxt;
  document.getElementById('greetingTxt').innerText = t.greetingTxt;
  document.getElementById('boxTitle').innerText = t.boxTitle;
  document.getElementById('boxSub').innerText = t.boxSub;
  document.getElementById('btn1Txt').innerText = t.btn1Txt;
  document.getElementById('btn2Txt').innerText = t.btn2Txt;
  document.getElementById('btn3Txt').innerText = t.btn3Txt;
  document.getElementById('userInput').placeholder = t.placeholder;
}

const gifts = [
  { item: "🐍 MP40 Cobra Lv.7 + 👑 હા મોજ હા! Tag", trick: "Evo Gun Level 4 (210 Tokens) પર જ Double Damage ખુલે છે — 14,500 ડાયમંડ બગાડશો નહીં!" },
  { item: "❄️ M416 Glacier Lv.8 + 🐧 Ninja Penguin", trick: "Mythic Forge માં રોજ 10 UC સ્પિન કરવાથી ફક્ત 300 UC માં મિથિક સૂટ મળે છે!" },
  { item: "🐉 Dravion X-Suit 2026 + ★Gujju WØRRIER★", trick: "One-Tap Headshot માટે Fire Button સાઈઝ 45% અને DPI 440 રાખો!" }
];

function openSurprise() {
  const g = gifts[Math.floor(Math.random() * gifts.length)];
  document.getElementById('screenBox').innerHTML = `
    <div style="font-size:12px; color:#34d399; font-weight:900;">🎉 હા મોજ હા! MYSTERY BOX UNLOCKED:</div>
    <div style="font-size:18px; font-weight:900; color:var(--gold); margin:6px 0;">${g.item}</div>
    <div style="font-size:13px; color:#e2e8f0; background:#1e293b; padding:8px; border-radius:8px;">💡 <strong>Zoya Secret:</strong> ${g.trick}</div>
    <button class="copy-pill" onclick="copyTxt('${g.item}')">📋 Copy Reward & Tag</button>
  `;
}

function givePhoneCode() {
  const code = "7309-1086-6844-4312-478";
  document.getElementById('screenBox').innerHTML = `
    <div style="font-size:12px; color:var(--blue); font-weight:900;">🎯 2026 UNIVERSAL PRO SETTING (ALL PHONES):</div>
    <div style="font-size:14px; font-weight:800; color:#fff; margin:6px 0;">🔥 Free Fire: General 184 • Red Dot 180 • Fire Btn 45%</div>
    <div style="font-size:13px; color:var(--gold); font-weight:900;">🪖 BGMI Code: ${code}</div>
    <button class="copy-pill" onclick="copyTxt('${code}')">📋 1-Click Copy Code</button>
  `;
}

function makeMyCard() {
  const val = document.getElementById('userInput').value.trim() || "ROYAL GAMER";
  showVipCard(val);
}

function askZoya() {
  const q = document.getElementById('userInput').value.trim();
  if (!q) { openSurprise(); return; }
  showVipCard(q);
}

function showVipCard(name) {
  const stylish = `👑ᴳᵁʲʲᵁ•${name.toUpperCase()}★`;
  document.getElementById('screenBox').innerHTML = `
    <div style="background:linear-gradient(135deg,#422006,#78350f); border:2px solid var(--gold); border-radius:12px; padding:12px;">
      <div style="font-size:10px; color:#fde047; font-weight:900;">🏆 MINI ZOYA OFFICIAL VIP PASS</div>
      <div style="font-size:20px; font-weight:900; color:#fff; margin:4px 0;">${stylish}</div>
      <div style="font-size:11px; color:#34d399; font-weight:800;">✅ Pro Sensitivity: 185 | 19-Digit Code: 7298-1074-6823-4301-468</div>
    </div>
    <button class="copy-pill" onclick="copyTxt('${stylish}')">📋 Copy My VIP Name</button>
  `;
}

function copyTxt(t) {
  navigator.clipboard.writeText(t);
  alert("✅ કોપી થઈ ગયું: " + t);
}
</script>
</body>
</html>
