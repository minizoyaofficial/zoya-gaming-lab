<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Winner - Map v0.2</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: Arial, sans-serif; font-weight: bold; font-size: 24px; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">🏆 WORLD WINNER 🏆<br><span style="font-size:16px; color:#FFD700;">Map v0.2 - Hills & Obstacles</span></div>

    <script>
        // 1. सीन और आसमान
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB'); // नीला आसमान
        scene.fog = new THREE.FogExp2('#87CEEB', 0.004); // मैप के किनारों को छिपाने के लिए कोहरा

        // 2. कैमरा
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // गेम में असली परछाई चालू करना
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.01; // कैमरे को ज़मीन के नीचे जाने से रोकना

        // 3. गेमिंग रोशनी (सूरज)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(100, 200, 50);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -150;
        sunLight.shadow.camera.right = 150;
        sunLight.shadow.camera.top = 150;
        sunLight.shadow.camera.bottom = -150;
        scene.add(sunLight);

        // 4. ऊबड़-खाबड़ ज़मीन (Hills) बनाना
        const groundGeo = new THREE.PlaneGeometry(1000, 1000, 60, 60);
        
        // गणित (Math) का इस्तेमाल करके ज़मीन में पहाड़ और गड्ढे बनाना
        const vertices = groundGeo.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i];
            const y = vertices[i + 1];
            vertices[i + 2] = Math.sin(x / 30) * 6 + Math.cos(y / 30) * 6; 
        }
        groundGeo.computeVertexNormals();

        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x3b7a15, // असली घास का गहरा रंग
            roughness: 0.9 
        }); 
        
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true; // ज़मीन पर परछाई पड़ेगी
        scene.add(ground);

        // 5. छुपने के लिए लकड़ी के बक्से (Crates)
        const boxGeo = new THREE.BoxGeometry(6, 6, 6);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.8 }); // लकड़ी का रंग
        
        for(let i = 0; i < 40; i++) {
            const box = new THREE.Mesh(boxGeo, boxMat);
            // पूरे मैप में अलग-अलग जगह बक्से रखना
            box.position.x = (Math.random() - 0.5) * 400;
            box.position.z = (Math.random() - 0.5) * 400;
            // ज़मीन की ऊंचाई के हिसाब से बक्सों को सेट करना
            box.position.y = Math.sin(box.position.x / 30) * 6 + Math.cos(box.position.z / 30) * 6 + 3; 
            box.castShadow = true;
            box.receiveShadow = true;
            scene.add(box);
        }

        // 6. एनिमेशन लूप
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
