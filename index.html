<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>World Winner - Map v0.8</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #5ab1e6; touch-action: none; /* मोबाइल पर स्क्रीन को स्क्रॉल होने से रोकेगा */ }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: 'Impact', sans-serif; font-size: 24px; text-shadow: 2px 2px 5px #000; pointer-events: none; z-index: 10; }
        #loading { position: absolute; top: 40px; width: 100%; text-align: center; color: #00FF00; font-family: Arial; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px #000; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 255, 255, 0.9); font-size: 20px; pointer-events: none; z-index: 10; text-shadow: 1px 1px 2px #000; }
        
        /* गेमिंग जॉयस्टिक का डिज़ाइन */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); z-index: 20; }
        #joystick-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; }
        
        /* फायर बटन */
        #fire-btn { position: absolute; bottom: 40px; right: 30px; width: 70px; height: 70px; background: rgba(255, 50, 50, 0.6); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); color: white; font-weight: bold; z-index: 20; display: flex; justify-content: center; align-items: center; user-select: none; }
        #fire-btn:active { background: rgba(255, 0, 0, 0.9); transform: scale(0.9); }
    </style>
    <!-- 3D लाइब्रेरी (यहाँ OrbitControls हटा दिया गया है क्योंकि अब कैमरा फौजी को फॉलो करेगा) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="ui">🏆 WORLD WINNER - FPS MODE 🏆</div>
    <div id="loading">🏃‍♂️ फौजी लोड हो रहा है...</div>
    <div id="crosshair">✛</div>
    
    <!-- मोबाइल कंट्रोल्स -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="fire-btn">FIRE</div>

    <script>
        // 1. बेसिक सीन और कोहरा
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB'); 
        scene.fog = new THREE.FogExp2('#87CEEB', 0.015); 

        // 2. गेमर कैमरा
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 3. गेमिंग लाइटिंग
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // 4. असली घास वाला मैदान (डिब्बा हटा दिया गया है)
        const textureLoader = new THREE.TextureLoader();
        const grassTex = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(100, 100);

        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.8 }); 
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 5. फौजी (.glb) और एनिमेशन
        let soldier, mixer, idleAction, runAction;
        let isMoving = false;
        const clock = new THREE.Clock();
        const loader = new THREE.GLTFLoader();

        loader.load('./Soldier.glb', function (gltf) {
            soldier = gltf.scene;
            soldier.scale.set(3, 3, 3); 
            soldier.position.set(0, 0, 0); // फौजी को सीधे ज़मीन (घास) पर रखा
            
            soldier.traverse(function (child) {
                if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
            });
            scene.add(soldier);

            // एनिमेशन सेट करना
            mixer = new THREE.AnimationMixer(soldier);
            idleAction = mixer.clipAction(gltf.animations[0]); // खड़ा रहना
            runAction = mixer.clipAction(gltf.animations[1]);  // दौड़ना
            
            idleAction.play(); 
            document.getElementById('loading').style.display = 'none';
        });

        // 6. जॉयस्टिक कोडिंग (Mobile Touch Controls)
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let joyX = 0, joyY = 0;

        // जब उंगली स्क्रीन पर लगे
        zone.addEventListener('touchstart', handleTouch, {passive: false});
        zone.addEventListener('touchmove', handleTouch, {passive: false});
        // जब उंगली हटे
        zone.addEventListener('touchend', () => {
            isMoving = false;
            joyX = 0; joyY = 0;
            knob.style.transform = `translate(0px, 0px)`; // जॉयस्टिक वापस बीच में
            if(runAction && idleAction) { runAction.stop(); idleAction.play(); } // फौजी वापस खड़ा हो जाए
        });

        function handleTouch(e) {
            e.preventDefault();
            isMoving = true;
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let x = e.touches[0].clientX - centerX;
            let y = e.touches[0].clientY - centerY;
            
            const max = 25; // जॉयस्टिक कितना बाहर जा सकता है
            const dist = Math.sqrt(x*x + y*y);
            if (dist > max) { x = (x/dist)*max; y = (y/dist)*max; }
            
            knob.style.transform = `translate(${x}px, ${y}px)`;
            joyX = x / max;
            joyY = y / max;

            if(runAction && idleAction && !runAction.isRunning()) {
                idleAction.stop();
                runAction.play(); // फौजी का दौड़ना चालू
            }
        }

        // 7. एनिमेशन लूप (कैमरा फौजी के पीछे सेट करना)
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (mixer) mixer.update(delta);

            if (soldier) {
                // जॉयस्टिक के हिसाब से फौजी को चलाना
                if (isMoving) {
                    soldier.rotation.y -= joyX * 0.05; // लेफ्ट/राइट घूमना
                    soldier.translateZ(joyY * 0.15);   // आगे/पीछे चलना
                }

                // कैमरा को फौजी के कंधे के पीछे सेट करना (Free Fire Style)
                const offset = new THREE.Vector3(0, 4, 8); // कंधे से 4 ऊपर और 8 पीछे
                const camPos = offset.applyMatrix4(soldier.matrixWorld);
                camera.position.lerp(camPos, 0.1); // कैमरे का फौजी के पीछे-पीछे आना
                
                // कैमरा फौजी के सिर के थोड़ा आगे देखेगा (ताकि Crosshair सही रहे)
                const lookTarget = new THREE.Vector3(0, 2.5, -5).applyMatrix4(soldier.matrixWorld);
                camera.lookAt(lookTarget);
            }

            renderer.render(scene, camera);
        }
        animate();

        // स्क्रीन रोटेशन फिक्स
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
