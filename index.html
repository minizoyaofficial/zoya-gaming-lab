<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>World Winner - Master Blueprint</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: 'Impact', sans-serif; font-size: 24px; text-shadow: 2px 2px 5px #000; pointer-events: none; z-index: 10; }
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        #loading-text { color: #FFD700; font-family: Arial; font-weight: bold; font-size: 18px; margin-bottom: 20px; text-align: center; }
        .spinner { border: 6px solid #333; border-top: 6px solid #FFD700; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00FF00; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 1px 1px 2px #000; }
        
        /* जॉयस्टिक और फायर बटन */
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); z-index: 20; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.9); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; }
        #fire-btn { position: absolute; bottom: 50px; right: 40px; width: 80px; height: 80px; background: rgba(255, 50, 50, 0.6); border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.7); color: white; font-weight: bold; font-size: 18px; z-index: 20; display: flex; justify-content: center; align-items: center; user-select: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">🚀 World Winner Engine Load हो रहा है...<br><span style="font-size:12px; color:white;">Checking for map.glb...</span></div>
    </div>

    <div id="ui">🏆 WORLD WINNER 🏆<br><span id="map-status" style="font-size:14px; color:#00FF00;">Waiting for Map...</span></div>
    <div id="crosshair">✛</div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="fire-btn">FIRE</div>

    <script>
        const scene = new THREE.Scene();
        
        // असली गेमिंग आसमान (Sky)
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/2294472375_24a3b8ef46_o.jpg', function(texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = texture;
            scene.environment = texture;
        });

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(150, 300, 100);
        sunLight.castShadow = true;
        scene.add(sunLight);

        let soldier, mixer, idleAction, runAction;
        let isMoving = false;
        const clock = new THREE.Clock();
        const loader = new THREE.GLTFLoader();

        let itemsLoaded = 0;
        function checkLoad() {
            itemsLoaded++;
            if(itemsLoaded === 2) {
                document.getElementById('loading-screen').style.display = 'none';
            }
        }

        // 1. आपके GitHub से असली 'map.glb' लोड करने की कोशिश
        loader.load('./map.glb', function (gltf) {
            const realMap = gltf.scene;
            realMap.position.set(0, 0, 0);
            realMap.traverse(function (child) {
                if (child.isMesh) { child.receiveShadow = true; child.castShadow = true; }
            });
            scene.add(realMap);
            document.getElementById('map-status').innerText = "✅ Real Free Fire Map Loaded!";
            checkLoad();
        }, undefined, function (error) {
            // अगर GitHub पर 'map.glb' नहीं मिलती है, तो बैकअप के लिए घास का मैदान बनाएँ (ताकि नीली दीवारें न दिखें)
            console.warn("map.glb not found. Loading Backup Terrain.");
            document.getElementById('map-status').innerText = "⚠️ Please upload 'map.glb' to GitHub";
            document.getElementById('map-status').style.color = "red";
            
            const grassTex = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
            grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
            grassTex.repeat.set(50, 50);
            const groundGeo = new THREE.PlaneGeometry(1000, 1000, 50, 50);
            const vertices = groundGeo.attributes.position.array;
            for (let i = 0; i < vertices.length; i += 3) {
                vertices[i + 2] = Math.sin(vertices[i] / 50) * 5 + Math.cos(vertices[i + 1] / 50) * 5; 
            }
            groundGeo.computeVertexNormals();
            const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9 }); 
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            checkLoad();
        });

        // 2. फौजी कैरेक्टर लोड करना
        loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Soldier.glb', function (gltf) {
            soldier = gltf.scene;
            soldier.scale.set(3, 3, 3); 
            soldier.position.set(0, 2, 0); 
            soldier.traverse(function (child) {
                if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
            });
            scene.add(soldier);

            mixer = new THREE.AnimationMixer(soldier);
            idleAction = mixer.clipAction(gltf.animations[0]); 
            runAction = mixer.clipAction(gltf.animations[1]);  
            idleAction.play(); 
            checkLoad();
        });

        // 3. जॉयस्टिक कंट्रोल्स
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let joyX = 0, joyY = 0;

        zone.addEventListener('touchstart', handleTouch, {passive: false});
        zone.addEventListener('touchmove', handleTouch, {passive: false});
        zone.addEventListener('touchend', () => {
            isMoving = false;
            joyX = 0; joyY = 0;
            knob.style.transform = `translate(0px, 0px)`; 
            if(runAction && idleAction) { runAction.stop(); idleAction.play(); } 
        });

        function handleTouch(e) {
            e.preventDefault();
            isMoving = true;
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let x = e.touches[0].clientX - centerX;
            let y = e.touches[0].clientY - centerY;
            
            const max = 35; 
            const dist = Math.sqrt(x*x + y*y);
            if (dist > max) { x = (x/dist)*max; y = (y/dist)*max; }
            
            knob.style.transform = `translate(${x}px, ${y}px)`;
            joyX = x / max;
            joyY = y / max;

            if(runAction && idleAction && !runAction.isRunning()) {
                idleAction.stop();
                runAction.play(); 
            }
        }

        // 4. कैमरा और मूवमेंट
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (mixer) mixer.update(delta);

            if (soldier) {
                if (isMoving) {
                    soldier.rotation.y -= joyX * 0.05; 
                    soldier.translateZ(joyY * 0.20);   
                }
                const offset = new THREE.Vector3(0, 4, 8); 
                const camPos = offset.applyMatrix4(soldier.matrixWorld);
                camera.position.lerp(camPos, 0.1); 
                
                const lookTarget = new THREE.Vector3(0, 2.5, -5).applyMatrix4(soldier.matrixWorld);
                camera.lookAt(lookTarget);
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
