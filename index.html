<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Winner - Map v0.0</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; } 
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: Arial, sans-serif; font-weight: bold; font-size: 24px; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">🏆 WORLD WINNER 🏆<br><span style="font-size:16px; color:#FFD700;">Map v0.0 - Base Terrain</span></div>

    <script>
        // 1. सीन सेटअप (हमारी दुनिया)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB'); // नीला आसमान
        scene.fog = new THREE.Fog('#87CEEB', 50, 400); // किनारों को छिपाने के लिए कोहरा

        // 2. कैमरा (हमारी आँखें)
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 40); // थोड़ा ऊपर से देखने के लिए

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 3. रोशनी (सूरज)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(100, 200, 100);
        scene.add(sunLight);

        // 4. बरमूडा की ज़मीन (बड़ा हरा मैदान)
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50 }); // हरा रंग
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2; // ज़मीन को लेटाना
        scene.add(ground);

        // 5. एनिमेशन लूप
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
